[project]
name = "churn-mlops"
version = "0.1.0"
description = "End-to-end MLOps system for customer churn prediction — portfolio project."
requires-python = ">=3.12"
dependencies = [
    "dvc>=3.67",
    "evidently>=0.7.21",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "mlflow>=2.10,<3",
    "numpy>=1.26",
    "pandas>=2.2,<3",
    "pandera>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "uvicorn>=0.46.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
