# DVC pipeline definition.
#
# Each `stage` is a node in a DAG. DVC re-runs a stage when any of its `deps`
# change (file content, not just timestamps) or when its `cmd` changes.
# Outputs are versioned in the DVC cache and gitignored automatically.
#
# Run the whole pipeline:    uv run dvc repro
# Run a single stage:        uv run dvc repro <stage_name>
# Show the DAG:              uv run dvc dag

stages:
  ingest:
    cmd: uv run python -m src.ingestion.cli --n-rows 2000 --seed 42
    deps:
      - src/ingestion
    outs:
      - data/raw/churn.csv
      - data/processed/churn.csv

  featurize:
    cmd: uv run python -m src.features.build
    deps:
      - data/processed/churn.csv
      - src/features
      - src/ingestion/clean.py
    outs:
      - data/features/churn_features.csv

  train:
    cmd: uv run python -m src.training.train
    deps:
      - data/features/churn_features.csv
      - src/training
    # cache: false keeps the metrics file in git (not in the DVC cache),
    # so metric evolution is visible in commit history. The MLflow tracking
    # store under mlruns/ is the deeper artifact log; this JSON is the
    # quick-glance summary CI/CD will gate on in Phase 6.
    metrics:
      - metrics/train_metrics.json:
          cache: false

  evaluate:
    cmd: uv run python -m src.evaluation.promote
    deps:
      - metrics/train_metrics.json
      - src/evaluation
    # The MLflow registry under mlruns/ is implicit state — read but not
    # declared as a DVC dep (it's machine-local, not bytes-reproducible).
    # The verdict file IS deterministic given (train_metrics + registry),
    # which is what we commit and what CI will gate on in Phase 6.
    metrics:
      - metrics/promotion_decision.json:
          cache: false

  monitor:
    cmd: uv run python -m src.monitoring.drift
    deps:
      - data/features/churn_features.csv
      - src/monitoring
    outs:
      # The HTML report can be 100+ KB. Keep it cached (DVC-tracked, git-ignored)
      # so the repo stays lean; pull from the cache or regenerate locally.
      - metrics/drift_report.html
    metrics:
      # Small structured summary (cache: false -> tracked in git) so a PR diff
      # shows "drift_share went from 0.0 to 0.65" alongside the model metrics
      # diff. CI's scheduled trigger reads this to decide whether to fast-track
      # a retrain.
      - metrics/drift_report.json:
          cache: false
