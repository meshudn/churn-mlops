# DVC pipeline definition.
#
# Each `stage` is a node in a DAG. DVC re-runs a stage when any of its `deps`
# change (file content, not just timestamps) or when its `cmd` changes.
# Outputs are versioned in the DVC cache and gitignored automatically.
#
# Run the whole pipeline:    uv run dvc repro
# Run a single stage:        uv run dvc repro <stage_name>
# Show the DAG:              uv run dvc dag

stages:
  ingest:
    cmd: uv run python -m src.ingestion.cli --n-rows 2000 --seed 42
    deps:
      - src/ingestion
    outs:
      - data/raw/churn.csv
      - data/processed/churn.csv

  featurize:
    cmd: uv run python -m src.features.build
    deps:
      - data/processed/churn.csv
      - src/features
      - src/ingestion/clean.py
    outs:
      - data/features/churn_features.csv

  train:
    cmd: uv run python -m src.training.train
    deps:
      - data/features/churn_features.csv
      - src/training
    # cache: false keeps the metrics file in git (not in the DVC cache),
    # so metric evolution is visible in commit history. The MLflow tracking
    # store under mlruns/ is the deeper artifact log; this JSON is the
    # quick-glance summary CI/CD will gate on in Phase 6.
    metrics:
      - metrics/train_metrics.json:
          cache: false
