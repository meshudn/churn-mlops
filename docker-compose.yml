# Local-dev orchestration for the inference API.
#
# Two services share one image:
#
#   - ``train``: runs ``dvc repro`` once at startup, populating the named
#     volume ``mlruns`` with a registry whose paths are container-internal
#     (``/app/mlruns/...``). Exits when done. Without this, mlruns/ created
#     on the host has absolute host paths baked into meta.yaml — those paths
#     don't exist inside the container and the API starts in degraded mode.
#
#   - ``api``: waits for ``train`` to complete successfully, then mounts
#     the same named volume read-only and serves predictions. Restarting
#     ``api`` re-reads the registry; restarting ``train`` re-trains.
#
# In a real deployment the registry would live behind an HTTP MLflow tracking
# server backed by Postgres + S3; the named-volume + train-service dance
# disappears and ``CHURN_API_MLFLOW_TRACKING_URI`` becomes the only knob.
#
# Usage:
#     docker compose up --build
#     curl http://localhost:8000/health
#     curl -X POST http://localhost:8000/predict -H 'content-type: application/json' -d @sample.json
#
#     # Force a re-train run:
#     docker compose run --rm train

services:
  train:
    build:
      context: .
      dockerfile: Dockerfile
    image: churn-mlops:local
    command:
      - sh
      - -c
      - |
        set -e
        cd /app
        echo "[train] reproducing pipeline..."
        uv run dvc repro
        echo "[train] done. registry now lives at /app/mlruns inside the volume."
    volumes:
      - mlruns:/app/mlruns
    environment:
      PYTHONUNBUFFERED: "1"

  api:
    image: churn-mlops:local
    pull_policy: never  # use the locally-built image
    ports:
      - "8000:8000"
    environment:
      CHURN_API_MODEL_NAME: churn-model
      CHURN_API_MODEL_ALIAS: production
      CHURN_API_MLFLOW_TRACKING_URI: file:///app/mlruns
      CHURN_API_THRESHOLD: "0.5"
    volumes:
      - mlruns:/app/mlruns:ro
    depends_on:
      train:
        condition: service_completed_successfully
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - >-
          import urllib.request, json, sys;
          r = urllib.request.urlopen('http://localhost:8000/health', timeout=2);
          d = json.loads(r.read());
          sys.exit(0 if d.get('model_loaded') else 1)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  mlruns:
